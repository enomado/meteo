[package]
name = "meteo_core"
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
# Keep stricter review rules enabled in regular `cargo clippy` runs. Individual
# casts and embedded-specific async patterns still need local justification.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Логика прошивки без железа: протокол (датаграмма, кодек, окно приёма,
# отправитель), LED-палитра, решение watchdog, выбор сети. `no_std`, без
# esp-зависимостей ⇒ тесты идут на хосте (`cargo test` в этой директории):
# `meteo/.cargo/config.toml` с riscv-таргетом сюда не дотягивается.

[features]
# Сторона приёмника протокола v2 (`server`: окна по загрузкам в HashMap).
std = []

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
# round() для перевода f32 в фиксированную точку без std.
libm = "0.2.16"
# serde: декодирование батча приёмником в тот же тип, что кодирует прошивка.
heapless = { version = "0.9", features = ["serde"] }
# experimental-derive: `#[derive(MaxSize)]` — бюджет пакета проверяется при
# компиляции (wire.rs).
postcard = { version = "1.1.3", default-features = false, features = ["experimental-derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
# Слова журнала здоровья: у прошивки они в RTC-памяти, а `Persistable` esp-hal
# реализован для атомиков portable-atomic (на riscv32imc нет нативного CAS).
portable-atomic = { version = "1.15.0", default-features = false }
# Локальные часы NTP-клиента (`ntp::BootClock`) — генератор меток sntpc.
sntpc = { version = "0.11.0", default-features = false }

[dev-dependencies]
# Тесты гоняют и сторону приёмника (DST: модель сервера — настоящий `server`).
meteo_core = { path = ".", features = ["std"] }
proptest = "1.11"
# DST общей SPI-шины (`tests/shared_spi_dst.rs`): настоящий `SpiDevice` прошивки
# против модели шины. Версии и фичи — как в графе `meteo` (без `time`).
embassy-embedded-hal = "0.6.0"
embassy-sync = "0.8.0"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
