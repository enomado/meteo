[package]
edition = "2024"
name = "meteo"
# rust-version = "1.89"
version = "0.1.0"

[[bin]]
name = "meteo"
path = "./src/bin/main.rs"

[dependencies]
cfg-if = { version = "1.0.5" }
static_cell = { version = "2.1.1", features = [] }

bmp390-rs = { version = "0.4.0" }
libscd = { version = "0.5.1", default-features = false, features = ["async", "scd4x", "scd41"] }

# Фича portable-atomic нужна на riscv32imc (нет native CAS).
heapless = { version = "0.9", features = ["portable-atomic"] }
portable-atomic = { version = "1.15.0" }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
# experimental-derive: `#[derive(MaxSize)]` — бюджет пакета проверяется при
# компиляции (network.rs).
postcard = { version = "1.1.3", features = ["experimental-derive"] }
aes-gcm = { version = "0.11.1", default-features = false, features = [
  "aes",
] }


sntpc = { version = "0.11.0", default-features = false, features = [
  "defmt",
  "log",
] }
sntpc-net-embassy = { version = "0.11.0", default-features = false, features = [
  "defmt",
] }
sntpc-time-embassy = { version = "0.6.0", default-features = false }

embedded-nal = { version = "0.9.0" }
embedded-io = { version = "0.7.1", features = [
  # 
  # "defmt-03",
] }
embedded-io-async = { version = "0.7.0", features = [
  # 
  # "defmt-03",
] }


# 1.x — та же линия, что тянет esp-hal; 0.3.100 в графе остаётся только как
# compat-шим для чужих крейтов (embedded-io 0.6, embassy-net-driver).
defmt = { version = "1.1.1", features = [] }


# package = "esp32c3-hal"
esp-hal = { git = "https://github.com/esp-rs/esp-hal", branch = "main", features = [
  "rt",
  "defmt",
  "esp32c3",
  "unstable",
] }

esp-alloc = { git = "https://github.com/esp-rs/esp-hal", package = "esp-alloc", branch = "main", features = [
  # "defmt",
  "esp32c3",
] }

esp-sync = { git = "https://github.com/esp-rs/esp-hal", package = "esp-sync", branch = "main", features = [
  # "defmt",
  "esp32c3",
] }


esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", package = "esp-bootloader-esp-idf", branch = "main", features = [
  "esp32c3",
] }


# esp-radio is wsp-wifi
esp-radio = { git = "https://github.com/esp-rs/esp-hal", package = "esp-radio", branch = "main", features = [
  # "builtin-scheduler",
  "unstable",
  "defmt",
  "esp-alloc",
  "esp32c3",
  "wifi",
] }

# esp-preempt = { git = "https://github.com/esp-rs/esp-hal", package = "esp-preempt", branch = "main", features = [
#   "esp32c3",
# ] }


esp-println = { git = "https://github.com/esp-rs/esp-hal", package = "esp-println", branch = "main", features = [
  "esp32c3",
  # "log-04",
  "defmt-espflash",
  # "critical-section",
] }

esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", package = "esp-backtrace", branch = "main", features = [
  # "defmt",
  "println",
  # "exception-handler",
  "panic-handler",
  # вместо вечного loop{} после паники зовём custom_halt() → software_reset
  # (self-heal). Бэктрейс печатается ДО этого, defmt-лог паники сохраняется.
  # См. crate::watchdog::custom_halt и инцидент 2026-07-04 (заморозка на 22ч).
  "custom-halt",
  # "semihosting",
  "esp32c3",
] }

embassy-sync = { version = "0.8.0" }
embassy-embedded-hal = { version = "0.6.0" }
embassy-executor = { version = "0.10.0", features = [
  # "defmt",
  # "task-arena-size-20480",
] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dns",
] }


# critical-section = "1.2.0"


# for more networking protocol support see https://crates.io/crates/edge-net
embassy-time = { version = "0.5.1", features = [
  # 
  # "defmt",
] }

# esp-hal-embassy = { git = "https://github.com/esp-rs/esp-hal", package = "esp-hal-embassy", branch = "main", features = [
#   # "defmt",
#   "esp32c3",
# ] }


esp-rtos = { git = "https://github.com/esp-rs/esp-hal", package = "esp-rtos", branch = "main", features = [
  # "defmt",
  "esp32c3",
  "embassy",
  # "esp-alloc",
  "esp-radio",
] }



[build-dependencies]
toml = "1.1.6"

# Vendored local esp-hal as path patch (no extra commits — fork == upstream/main).
# - synced to upstream/main `686a3e6c` (2026-09-23, esp-radio 1.0.0-beta.0 →
#   beta.2), fast-forward of esp-hal branch `tmp/upstream-main-20260903`;
#   prev syncs `c9240a08` (2026-09-03, esp-hal 1.1.0 → 1.2.0, esp-rtos
#   0.3.0 → 0.4.0), `df161e61` (2026-06-16), `2294099a` (2026-05-22)
# - kept as path patch for fast local hacks; PHY fix from prev fork is now in upstream
[patch."https://github.com/esp-rs/esp-hal"]
esp-hal = { path = "/home/sc/t/embed/esp-hal/esp-hal" }
esp-alloc = { path = "/home/sc/t/embed/esp-hal/esp-alloc" }
esp-sync = { path = "/home/sc/t/embed/esp-hal/esp-sync" }
esp-bootloader-esp-idf = { path = "/home/sc/t/embed/esp-hal/esp-bootloader-esp-idf" }
esp-radio = { path = "/home/sc/t/embed/esp-hal/esp-radio" }
esp-println = { path = "/home/sc/t/embed/esp-hal/esp-println" }
esp-backtrace = { path = "/home/sc/t/embed/esp-hal/esp-backtrace" }
esp-rtos = { path = "/home/sc/t/embed/esp-hal/esp-rtos" }
esp-phy = { path = "/home/sc/t/embed/esp-hal/esp-phy" }


[features]
esp32c3 = [
  "esp-backtrace/esp32c3",
  "esp-println/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  # "esp-hal-embassy/esp32c3",
  "esp-hal/esp32c3",
]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
